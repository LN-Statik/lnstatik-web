let msal,account,base=null,etag=null;
async function token(){try{return (await msal.acquireTokenSilent({scopes:SCOPES,account})).accessToken}catch(e){await msal.acquireTokenRedirect({scopes:SCOPES,account});throw e}}
async function g(path,opt={}){const t=await token();return fetch(path.startsWith('http')?path:GRAPH+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}})}
async function findBase(){for(const b of BASES){const r=await g(`/me/drive/root:/${enc(b)}?$select=id`);if(r.ok){base=b+'/LNStatik_wiki';return}}base='LNStatik_wiki'}
const FILE=()=>`/me/drive/root:/${enc(base+'/wiki.json')}`;
let W={articles:{},del:{}};
async function pull(){const m=await g(FILE()+'?$select=eTag');if(m.status===404){etag=null;return {articles:{},del:{}}}if(!m.ok)throw new Error('read '+m.status);
  etag=(await m.json()).eTag;const c=await g(FILE()+':/content');const j=await c.json();return {articles:j.articles||{},del:j.del||{}}}
async function push(changedId){const body=()=>JSON.stringify({app:'LNStatik wiki',verzia:1,ulozene:new Date().toISOString(),articles:W.articles,del:W.del});
  for(let i=0;i<3;i++){const r=await g(FILE()+':/content',{method:'PUT',headers:{'Content-Type':'application/json',...(etag?{'If-Match':etag}:{})},body:body()});
    if(r.ok){etag=(await r.json()).eTag;return}
    if(r.status===412||r.status===409){const R=await pull();const mine=W.articles[changedId],gone=W.del[changedId];
      for(const [k,a] of Object.entries(R.articles)){const l=W.articles[k];if(!l||(a.updated||0)>(l.updated||0))W.articles[k]=a}
      for(const [k,t] of Object.entries(R.del)){if(!W.articles[k]||(W.articles[k].updated||0)<t){delete W.articles[k];W.del[k]=t}}
      if(mine)W.articles[changedId]=mine;if(gone){delete W.articles[changedId];W.del[changedId]=gone}continue}
    throw new Error('write '+r.status)}throw new Error('konflikt')}

async function uploadImg(file){const name=Date.now().toString(36)+'_'+(file.name||'obrazok.png').replace(/[\\/:*?"<>|#%\s]/g,'_');

async function shrink(f){const img=await createImageBitmap(f);const k=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82))}

const MAT={

 C20:{n:'C20',t:'r',fm:20,ft0:11.5,fc0:19,fv:3.6,E:9500,E05:6400,G:590,rk:330,rm:400},

 C30:{n:'C30',t:'r',fm:30,ft0:19,fc0:24,fv:4.0,E:12000,E05:8000,G:750,rk:380,rm:460},

 GL28h:{n:'GL28h',t:'l',fm:28,ft0:22.3,fc0:28,fv:3.5,E:12600,E05:10500,G:650,rk:425,rm:460},

const DUR=[['perm','stále'],['long','dlhodobé'],['med','strednodobé'],['short','krátkodobé'],['inst','okamžité']];
const KMOD={1:{perm:.6,long:.7,med:.8,short:.9,inst:1.1},2:{perm:.6,long:.7,med:.8,short:.9,inst:1.1},3:{perm:.5,long:.55,med:.65,short:.7,inst:.9}};
const KDEF={1:.6,2:.8,3:2.0};
const GM={r:1.3,l:1.25};
function tramCalc(p){
 const m=MAT[p.mat];const L=p.L*1000,b=p.b,h=p.h;const sc=p.sc;
 const A=b*h,W=b*h*h/6,I=b*h**3/12;
 const gs=p.self?m.rm*9.81/1e3*(b/1000)*(h/1000):0;const G=p.gk+gs,Q=p.qk;
 const gM=GM[m.t];const kcr=0.67;
 const kh=m.t==='r'?(h<150?Math.min((150/h)**0.2,1.3):1):(h<600?Math.min((600/h)**0.1,1.1):1);
 const combos=[{n:'Len stále zaťaženie',Ed:p.gG*G,km:KMOD[sc].perm,dur:'perm'}];
 if(Q>0)combos.push({n:'Stále + premenné',Ed:p.gG*G+p.gQ*Q,km:KMOD[sc][p.dur],dur:p.dur});
 for(const c of combos){c.M=c.Ed*p.L**2/8;c.V=c.Ed*p.L/2;c.sig=c.M*1e6/W;c.tau=1.5*c.V*1e3/(kcr*b*h);
  c.fmd=c.km*kh*m.fm/gM;c.fvd=c.km*m.fv/gM;c.um=c.sig/c.fmd;c.uv=c.tau/c.fvd}
 const cm=combos.reduce((a,c)=>c.um>a.um?c:a),cv=combos.reduce((a,c)=>c.uv>a.uv?c:a);
 const w=q=>5*q*L**4/(384*m.E*I);const wG=w(G),wQ=w(Q);const kd=KDEF[sc];
 const winst=wG+wQ,wfin=wG*(1+kd)+wQ*(1+p.psi2*kd);const lim1=L/p.l1,lim2=L/p.l2;
 const r={m,L,b,h,A,W,I,gs,G,Q,gM,kcr,kh,kd,combos,cm,cv,wG,wQ,winst,wfin,lim1,lim2,ui:winst/lim1,uf:wfin/lim2};
 r.u=Math.max(cm.um,cv.uv,r.ui,r.uf);return r}

  <p class="lead">Rovnomerné zaťaženie, posúdenie na ohyb, šmyk a priehyb podľa STN EN 1995-1-1. Predpoklad: tlačený okraj je zabezpečený proti klopeniu.</p>
  <div class="tl"><form id="tf" class="tin">
   <fieldset><legend>Geometria</legend>${num('L','Rozpätie L','m')}<div class="two">${num('b','Šírka b','mm','1')}${num('h','Výška h','mm','1')}</div></fieldset>

    <p class="hint">Napr. úžitkové v bytoch: strednodobé, ψ₂ = 0,3. Sneh: krátkodobé, ψ₂ = 0 (over v národnej prílohe).</p></fieldset>

function bar(n,u,det){const ok=u<=1;return `<div class="ub ${ok?'ok':'no'}"><div class="ubh"><b>${n}</b><span>${pc(u)}</span></div><div class="ubt"><i style="width:${Math.min(u,1)*100}%"></i></div><small>${det}</small></div>`}
function tramOut(r,q){const m=r.m,ok=r.u<=1,cm=r.cm,cv=r.cv,durN=k=>(DUR.find(d=>d[0]===k)||[,k])[1];
  return `<div class="verd ${ok?'ok':'no'}"><b>${ok?'Vyhovuje':'Nevyhovuje'}</b><span>max. využitie ${pc(r.u)}</span></div>
  ${bar('Ohyb',cm.um,`σ<sub>m,d</sub> = ${nf(cm.sig)} MPa ≤ f<sub>m,d</sub> = ${nf(cm.fmd)} MPa`)}
  ${bar('Šmyk',cv.uv,`τ<sub>d</sub> = ${nf(cv.tau)} MPa ≤ f<sub>v,d</sub> = ${nf(cv.fvd)} MPa`)}
  ${bar('Priehyb okamžitý',r.ui,`w<sub>inst</sub> = ${nf(r.winst,1)} mm ≤ L/${q.l1} = ${nf(r.lim1,1)} mm`)}
  ${bar('Priehyb konečný',r.uf,`w<sub>fin</sub> = ${nf(r.wfin,1)} mm ≤ L/${q.l2} = ${nf(r.lim2,1)} mm`)}
  <details class="steps" open><summary>Postup výpočtu</summary>
  <h3>1. Prierez a materiál</h3><p>A = b·h = ${nf(r.A,0)} mm², W = b·h²/6 = ${nf(r.W/1e3,1)}·10³ mm³, I = b·h³/12 = ${nf(r.I/1e6,2)}·10⁶ mm⁴</p>
  <p>${m.n}: f<sub>m,k</sub> = ${nf(m.fm,1)} MPa, f<sub>v,k</sub> = ${nf(m.fv,1)} MPa, E<sub>0,mean</sub> = ${nf(m.E,0)} MPa, ρ<sub>mean</sub> = ${m.rm} kg/m³; γ<sub>M</sub> = ${nf(r.gM)} (${m.t==='r'?'rastlé drevo':'lepené lamelové drevo'})</p>
  <p>k<sub>h</sub> = ${nf(r.kh,3)} ${m.t==='r'?(r.h<150?'(h < 150 mm → (150/h)<sup>0,2</sup> ≤ 1,3)':'(h ≥ 150 mm)'):(r.h<600?'(h < 600 mm → (600/h)<sup>0,1</sup> ≤ 1,1)':'(h ≥ 600 mm)')}, k<sub>cr</sub> = ${nf(r.kcr)}, k<sub>def</sub> = ${nf(r.kd,1)} (trieda prevádzky ${q.sc})</p>
  <h3>2. Zaťaženie</h3><p>${q.self?`vlastná tiaž g<sub>s</sub> = ρ·g·b·h = ${nf(r.gs,3)} kN/m; `:''}G<sub>k</sub> = ${nf(r.G,3)} kN/m, Q<sub>k</sub> = ${nf(r.Q,3)} kN/m</p>
  <table><tr><th>Kombinácia</th><th>E<sub>d</sub> [kN/m]</th><th>k<sub>mod</sub></th><th>M<sub>d</sub> [kNm]</th><th>V<sub>d</sub> [kN]</th><th>ohyb</th><th>šmyk</th></tr>
  ${r.combos.map(c=>`<tr><td>${c.n} (${durN(c.dur)})</td><td>${nf(c.Ed,3)}</td><td>${nf(c.km)}</td><td>${nf(c.M,3)}</td><td>${nf(c.V,3)}</td><td>${pc(c.um)}</td><td>${pc(c.uv)}</td></tr>`).join('')}</table>
  <p class="hint">E<sub>d</sub> = γ<sub>G</sub>·G<sub>k</sub> (+ γ<sub>Q</sub>·Q<sub>k</sub>); M<sub>d</sub> = E<sub>d</sub>·L²/8; V<sub>d</sub> = E<sub>d</sub>·L/2. Rozhoduje kombinácia s najväčším využitím.</p>
  <h3>3. Ohyb (čl. 6.1.6)</h3><p>σ<sub>m,d</sub> = M<sub>d</sub>/W = ${nf(cm.sig)} MPa; f<sub>m,d</sub> = k<sub>mod</sub>·k<sub>h</sub>·f<sub>m,k</sub>/γ<sub>M</sub> = ${nf(cm.km)}·${nf(r.kh,3)}·${nf(m.fm,1)}/${nf(r.gM)} = ${nf(cm.fmd)} MPa → <b>${pc(cm.um)}</b></p>
  <h3>4. Šmyk (čl. 6.1.7)</h3><p>τ<sub>d</sub> = 1,5·V<sub>d</sub>/(k<sub>cr</sub>·b·h) = ${nf(cv.tau,3)} MPa; f<sub>v,d</sub> = k<sub>mod</sub>·f<sub>v,k</sub>/γ<sub>M</sub> = ${nf(cv.fvd,3)} MPa → <b>${pc(cv.uv)}</b></p>
  <h3>5. Priehyb (čl. 2.2.3, 7.2)</h3><p>w = 5·q·L⁴/(384·E<sub>0,mean</sub>·I): w<sub>inst,G</sub> = ${nf(r.wG)} mm, w<sub>inst,Q</sub> = ${nf(r.wQ)} mm, w<sub>inst</sub> = ${nf(r.winst)} mm → <b>${pc(r.ui)}</b></p>
  <p>w<sub>fin</sub> = w<sub>inst,G</sub>·(1 + k<sub>def</sub>) + w<sub>inst,Q</sub>·(1 + ψ<sub>2</sub>·k<sub>def</sub>) = ${nf(r.wfin)} mm → <b>${pc(r.uf)}</b></p>
  <p class="hint">Zanedbaná je šmyková deformácia a nadvýšenie. Použité odporúčané hodnoty normy – over národnú prílohu. Klopenie nie je posúdené (predpoklad k<sub>crit</sub> = 1).</p></details>
  <div class="pfoot"><button class="btn" onclick="window.print()">Vytlačiť / PDF</button><span>Vypočítané na lnstatik.sk · ${new Date().toLocaleDateString('sk-SK')}</span></div>`}
function vTriedy(){const ks=Object.keys(MAT);
  page(`<a href="#">Úvod</a> / <a href="#t">Nástroje</a> / Triedy dreva`,`<div class="tool md"><h1>Triedy dreva a súčinitele</h1><p class="lead">Charakteristické hodnoty podľa STN EN 338 (rastlé ihličnaté drevo) a STN EN 14080 (lepené lamelové drevo, homogénne). Súčinitele podľa STN EN 1995-1-1 – odporúčané hodnoty.</p>

  ${[['fm','f<sub>m,k</sub> ohyb','MPa',1],['ft0','f<sub>t,0,k</sub> ťah','MPa',1],['fc0','f<sub>c,0,k</sub> tlak','MPa',1],['fv','f<sub>v,k</sub> šmyk','MPa',1],['E','E<sub>0,mean</sub>','MPa',0],['E05','E<sub>0,05</sub>','MPa',0],['G','G<sub>mean</sub>','MPa',0],['rk','ρ<sub>k</sub>','kg/m³',0],['rm','ρ<sub>mean</sub>','kg/m³',0]].map(([k,n,u,d])=>`<tr><td>${n}</td><td>${u}</td>${ks.map(c=>`<td>${nf(MAT[c][k],d)}</td>`).join('')}</tr>`).join('')}</table></div>
  <h2>k<sub>mod</sub> – rastlé a lepené lamelové drevo</h2><div class="tw"><table><tr><th>Trieda prevádzky</th>${DUR.map(d=>`<th>${d[1]}</th>`).join('')}</tr>${[1,2,3].map(s=>`<tr><td>${s}</td>${DUR.map(d=>`<td>${nf(KMOD[s][d[0]])}</td>`).join('')}</tr>`).join('')}</table></div>
  <p class="hint">Trvanie zaťaženia – príklady: stále (vlastná tiaž), dlhodobé (sklady), strednodobé (úžitkové zaťaženie), krátkodobé (sneh, vietor – podľa národnej prílohy), okamžité (mimoriadne).</p>

function route(keepQ){const h=location.hash.slice(1);const [v,a,b]=h.split('/');S.id=null;S.nav='';
  if(!keepQ)S.q='';
  if(v==='a'){S.id=a;const x=W.articles[a];if(x){const n=norm({...x});S.nav=n.sec==='p'?'k:'+chOf(n.cat).k:n.sec}}
  else if(v==='p')S.nav='p';else if(v==='k')S.nav='k:'+a;else if(v==='t')S.nav='t';else if(v==='d')S.nav='d';else if(v==='n')S.nav='n';else if(v==='kontakt')S.nav='kontakt';else if(!v)S.nav='home';
  drawNav();
  if(v==='a')vArt(a);else if(v==='p')vPrir();else if(v==='k')vCh(a);
  else if(v==='t'){if(a==='tram')vTram();else if(a==='triedy')vTriedy();else vTools()}
  else if(v==='d')vDet();else if(v==='n')vNav();else if(v==='kontakt')vKontakt();
  else if(v==='novy')vEdit(null,a,b);else if(v==='upravit'){S.id=a;vEdit(a)}else vHome();
  if(keepQ){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  window.scrollTo(0,0)}

window.addEventListener('hashchange',()=>{if(document.body.classList.contains('on'))route()});
window.addEventListener('beforeunload',e=>{const f=$('#f');if(f&&$('#body')&&location.hash.match(/^#(novy|upravit)/)){e.preventDefault();e.returnValue=''}});

function gate(msg){$('#gate').innerHTML=`<style>#gate{background:#fff;min-height:100vh;display:flex;flex-direction:column}#gate .t{display:flex;justify-content:space-between;align-items:center;padding:28px 40px}#gate .t a{color:#8C959F;font-size:13px;cursor:pointer}#gate .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 60px}#gate svg.beam{width:min(640px,92vw);height:auto}#gate h1{font-size:clamp(30px,5vw,48px);margin:34px 0 12px;letter-spacing:-.02em;color:#1F2328}#gate p{color:#6E7781;font-size:17px;margin:0}#gate .f{text-align:center;color:#AEB4BA;font-size:12px;padding:22px}</style><div class="t">${brand('#1F2328')}<a id="login">Prihlásenie</a></div>${msg?`<p style="text-align:center;color:#B42318;font-size:14px">${esc(msg)}</p>`:''}<div class="c">${beamSVG()}<h1>Statika, krok za krokom.</h1><p>Drevené konštrukcie – príručka, nástroje a detaily. Pripravujeme.</p></div><div class="f">© ${new Date().getFullYear()} LN · STATIK</div>`;$('#login').onclick=()=>msal.loginRedirect({scopes:SCOPES,prompt:'select_account'})}
(async()=>{
  msal=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:location.origin+'/'},cache:{cacheLocation:'localStorage'}});
  await msal.initialize();let err='';
  try{const r=await msal.handleRedirectPromise();if(r&&r.account)account=r.account}catch(e){err='Prihlásenie zlyhalo.'}
  account=account||msal.getAllAccounts()[0];
  if(!account){gate(err);return}
  try{await findBase();W=await pull()}catch(e){console.error(e);gate('Nepodarilo sa načítať wiki z OneDrive.');return}
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  document.body.classList.add('on');route();
  setInterval(async()=>{if(document.hidden||location.hash.match(/^#(novy|upravit)/))return;try{const m=await g(FILE()+'?$select=eTag');if(m.ok){const e=(await m.json()).eTag;if(e!==etag){W=await pull();route()}}}catch(e){}},30000);
})();
